<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ead6bf" />
  <title>Editor de WAV</title>
</head>
<body>
  <div id="app">
    <header class="screen-head">
      <span class="eyebrow">Sampler</span>
      <h1>Editor de WAV</h1>
    </header>

    <section class="panel file-panel">
      <label class="btn sm primary">
        Escolher áudio ou vídeo
        <input id="file" type="file" accept="audio/*,video/*" hidden />
      </label>
      <p id="info" class="note" aria-live="polite">Nenhum arquivo carregado.</p>
    </section>

    <div id="editor"></div>
  </div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
